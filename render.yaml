services:
  - type: web
    name: diamarket-api
    runtime: node
    rootDir: apps/diamarket-api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DIAPAY_SECRET_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
