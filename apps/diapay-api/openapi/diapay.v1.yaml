openapi: 3.0.3
info:
  title: Diapay Public API
  version: 1.0.0
  description: Public /api/v1 contract frozen during Diapay progressive restructuring. Iteration 2 modularizes checkout, payments and refunds internally.
servers:
  - url: http://localhost:5100
paths:
  /health:
    get:
      summary: Healthcheck
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/config:
    get:
      summary: Public checkout configuration
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/checkout/sessions:
    get:
      summary: List checkout sessions
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      summary: Create checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCheckoutSession' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/checkout/sessions/{id}:
    get:
      summary: Retrieve checkout session
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/checkout/sessions/{id}/complete:
    post:
      summary: Complete checkout session
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/checkout/sessions/{id}/cancel:
    post:
      summary: Cancel checkout session
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/payments:
    post:
      summary: Create direct payment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePayment' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/payments/{id}:
    get:
      summary: Retrieve payment
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/payments/{id}/cancel:
    post:
      summary: Cancel payment
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/payments/{id}/refund:
    post:
      summary: Legacy refund payment route
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/refunds:
    post:
      summary: Create refund
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRefund' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/refunds/{id}:
    get:
      summary: Retrieve refund
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/webhooks:
    post:
      summary: Register webhook endpoint
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /api/v1/webhook-events:
    get:
      summary: List webhook events
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/api-keys:
    get:
      summary: List API keys
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      summary: Create API key
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /api/v1/api-keys/{id}:
    delete:
      summary: Delete API key
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/api-keys/{id}/rotate:
    post:
      summary: Rotate API key
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/marketplace/wallets:
    get:
      summary: List marketplace wallets
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/transactions:
    get:
      summary: List transactions
      responses: { '200': { $ref: '#/components/responses/Success' } }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Success:
      description: Standard success envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    Error:
      description: Standard error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data, message]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: object, additionalProperties: true }
        message: { type: string }
    ErrorEnvelope:
      type: object
      required: [success, message, error]
      properties:
        success: { type: boolean, enum: [false] }
        message: { type: string }
        error:
          type: object
          required: [code, details]
          properties:
            code: { type: string }
            details: { type: object, additionalProperties: true }
    CreateCheckoutSession:
      type: object
      required: [amount, currency, successUrl, cancelUrl]
      properties:
        amount: { type: integer, minimum: 1 }
        currency: { type: string }
        successUrl: { type: string }
        cancelUrl: { type: string }
    PaymentStatus:
      type: string
      enum: [created, pending, processing, requires_action, paid, failed, cancelled, expired, refunded, partially_refunded, disputed, chargeback]
    PaymentAttempt:
      type: object
      properties:
        id: { type: string }
        paymentId: { type: string }
        provider: { type: string }
        method: { type: string }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        amount: { type: integer }
        currency: { type: string }
        providerReference: { type: string }
        errorCode: { type: string }
        errorMessage: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RefundStatus:
      type: string
      enum: [created, pending, processing, succeeded, failed, cancelled]
    CreatePayment:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, minimum: 1 }
        currency: { type: string }
        method: { type: string }
    CreateRefund:
      type: object
      required: [paymentId]
      properties:
        paymentId: { type: string }
        amount: { type: integer, minimum: 1 }
        reason: { type: string }

  /providers:
    get:
      summary: List payment provider capabilities
      responses:
        '200':
          description: Provider capability list
  /providers/{provider}/capabilities:
    get:
      summary: Get provider capabilities
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Provider capability descriptor
  /providers/simulate:
    post:
      summary: Simulate an explicit mock provider scenario
      responses:
        '201':
          description: Mock provider result
  /webhooks/providers/{provider}:
    post:
      summary: Parse inbound provider webhook
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Normalized provider event
  /webhook-endpoints:
    get:
      summary: List merchant webhook endpoints
      responses:
        '200': { description: Webhook endpoints }
    post:
      summary: Create merchant webhook endpoint
      responses:
        '201': { description: Webhook endpoint with one-time secret }
  /webhook-endpoints/{id}:
    get:
      summary: Retrieve webhook endpoint
      responses:
        '200': { description: Webhook endpoint without secret }
    patch:
      summary: Update webhook endpoint
      responses:
        '200': { description: Updated webhook endpoint }
    delete:
      summary: Delete webhook endpoint
      responses:
        '200': { description: Deleted webhook endpoint }
  /webhook-events:
    get:
      summary: List sanitized webhook event audit log
      responses:
        '200': { description: Webhook events }
  /webhook-deliveries:
    get:
      summary: List webhook delivery attempts
      responses:
        '200': { description: Webhook deliveries }
  /wallets:
    get:
      summary: List merchant-scoped wallet views backed by the in-memory ledger
      responses:
        '200': { description: Wallet list }
  /wallets/{id}:
    get:
      summary: Retrieve a wallet view
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Wallet }
  /ledger/accounts:
    get:
      summary: List ledger accounts
      responses:
        '200': { description: Ledger accounts }
  /ledger/transactions:
    get:
      summary: List double-entry ledger transactions
      responses:
        '200': { description: Ledger transactions }
  /ledger/transactions/{id}:
    get:
      summary: Retrieve a ledger transaction
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Ledger transaction }
  /balances:
    get:
      summary: Read in-memory balance summary from the ledger
      responses:
        '200': { description: Balance summary }
  /applications:
    get:
      summary: List merchant applications
      responses:
        '200': { description: Application list }
    post:
      summary: Create a merchant application
      responses:
        '201': { description: Application created }
  /applications/{id}:
    get:
      summary: Retrieve a merchant application
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Application }
    patch:
      summary: Update a merchant application
      responses:
        '200': { description: Application updated }
    delete:
      summary: Archive a merchant application
      responses:
        '200': { description: Application archived }
  /api-keys:
    get:
      summary: List masked API keys
      responses:
        '200': { description: API keys without keyHash or full secret }
    post:
      summary: Create an API key and return the secret once
      responses:
        '201': { description: API key created with one-time secret }

  /reports/overview:
    get:
      summary: Merchant reporting overview
      parameters:
        - in: query
          name: environment
          schema: { type: string, enum: [test, live] }
        - in: query
          name: currency
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
      responses:
        '200': { description: Reporting overview }
  /reports/revenue:
    get:
      summary: Merchant revenue report
      responses:
        '200': { description: Revenue report }
  /reports/payments:
    get:
      summary: Merchant payments report
      responses:
        '200': { description: Paginated payments report }
  /reports/providers:
    get:
      summary: Provider reporting
      responses:
        '200': { description: Provider report }
  /reports/webhooks:
    get:
      summary: Webhook reporting
      responses:
        '200': { description: Webhook report }
  /reports/export/payments.csv:
    get:
      summary: Export payments CSV without secrets
      responses:
        '200': { description: Payments CSV, content: { text/csv: {} } }
  /reports/export/ledger.csv:
    get:
      summary: Export ledger CSV without secrets
      responses:
        '200': { description: Ledger CSV, content: { text/csv: {} } }
